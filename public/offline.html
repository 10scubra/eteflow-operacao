<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>ETEFlow • Sem conexão</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#07111f;color:#e8f4ff}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:420px;border:1px solid #1d3952;background:#0d1b2c;border-radius:20px;padding:28px}
    span{color:#18a8ff;font-weight:800;letter-spacing:.12em}h1{font-size:1.65rem;margin:.7rem 0}p{color:#a9bfd0;line-height:1.55}
    button{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:12px;background:#18a8ff;color:#04101c;font-size:1rem;font-weight:800}
  </style>
</head>
<body><main><span>ETEFLOW</span><h1>Sem conexão com o servidor</h1><p>Os registros não foram enviados. Reconecte à rede da ETE e tente novamente.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
</html>
